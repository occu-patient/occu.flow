/* ===== 點選式日期、臨場公司+廠區與任務排版 ===== */
.sub{font-size:14px;margin:16px 0 2px}
.pk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:520px;margin:6px 0}
.pk .ch{text-align:center;font-size:12px;color:var(--mu)}
.pkc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px;padding:2px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx);line-height:1.15}
.pkc b{font-size:14px;font-weight:600}.pkc small{font-size:10.5px;color:var(--mu);min-height:12px}
.pkc:hover{background:#EEF1F7;border-color:#AABAC8}
.pkc.has{background:#fff6e5;border-color:#f0d8a6}.pkc.has small{color:#7a4a00}
.pkc.sel,.pkc.sel:hover{background:var(--ac2);border-color:var(--ac2);color:#fff}.pkc.sel small{color:#C9DCE8}
.pkc:disabled,.pkc:disabled:hover{background:#E4E9F0;border-color:var(--bd);color:#AABAC8;cursor:not-allowed}.pkc:disabled small{color:#AABAC8}
.pkb{border:1px solid var(--bd);background:#F5F5F5;border-radius:12px;padding:10px 12px;margin:8px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border-radius:99px;padding:5px 13px;background:#fff;color:var(--mu)}
.seg button.on,.seg button.on:hover{background:#C9DCE8;border-color:#AABAC8;color:#1A2140;font-weight:600}
.tg2{display:inline-flex;align-items:center;gap:4px;background:var(--hl);border-radius:8px;padding:2px 3px 2px 9px;margin:3px 4px 3px 0;font-size:13px}
.tg2 button.x{padding:0 7px;border:0;background:transparent}.tg2.old{opacity:.5}
.st{border:1px solid var(--bd);border-radius:12px;background:#F5F5F5;margin:0 0 8px;padding:0}.st.ex{background:#EEF1F7;border-color:#AABAC8}
.st>summary{list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;cursor:pointer;color:var(--tx)}
.st>summary::-webkit-details-marker{display:none}
.st>summary::before{content:"▸";color:var(--mu);transition:transform .15s}.st[open]>summary::before{transform:rotate(90deg)}
.st .sn{flex:1 1 150px;min-width:0}.st .sn b{display:block;font-size:15px}.st .sn small{color:var(--mu);font-size:12px}
.st .sm{display:flex;flex-wrap:wrap;gap:2px}
.stb{padding:4px 12px 12px;border-top:1px solid var(--bd)}
.adv{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:2px 10px 8px;margin-top:10px}.adv>summary{padding:6px 0}
.tkg{border:1px solid var(--bd);border-radius:12px;background:#F5F5F5;margin-bottom:10px;overflow:hidden}
.tkh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#EEF1F7;border-bottom:1px solid var(--bd)}.tkh b{font-size:14.5px}.tkh small{color:var(--mu);font-size:12px;flex:1}
.tk2{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--bd)}.tk2:last-child{border:0}.tk2.off{opacity:.45}
.tk2 select{width:auto;padding:4px 8px}.tk2 input[type=checkbox]{width:18px;height:18px}.tk2 .chip{margin:0}
.tk2 .lkw{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}.tk2 .lkw input{width:auto;padding:4px 8px}

/* ===== 品牌圖／條款分頁 ===== */
:root{--sbe:256px}
.lgimg{display:block;flex:0 0 auto;border-radius:22%;border:1px solid var(--bd);background:#fff;object-fit:cover}
.sbh .lgimg{width:40px;height:40px;flex-basis:40px}
.sbh{align-items:flex-start}.sbh .lgimg{margin-top:2px}.sbh .lb{min-width:0}.sbh .tgl{display:block;white-space:normal;font-size:10.5px;line-height:1.45;margin-top:3px;text-wrap:balance}
.lgt{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 0 4px}
.lgb{border-radius:99px;padding:6px 16px;background:#fff;color:var(--mu)}
.lgb.on,.lgb.on:hover{background:#C9DCE8;border-color:#AABAC8;color:#1A2140;font-weight:600}
.lgp{border:1px solid var(--bd);border-radius:12px;background:#F5F5F5;padding:10px 16px;margin-top:8px;font-size:14px}.lgp[hidden]{display:none}
.lgp h3{display:none}
.t24{display:inline-flex;align-items:center;gap:4px}.t24 select{width:auto;min-width:62px;padding:5px 8px}
.bn{display:flex;align-items:baseline;justify-content:space-between;gap:2px 8px;flex-wrap:wrap}.vc{font-size:10.5px;color:var(--mu);white-space:nowrap;font-weight:400}.mbar .vc-slot{margin-left:2px}
@media (prefers-reduced-motion:reduce){.sbw,.sb,.lb{transition:none!important}}
/* ===== 卡片收合／展開開關、臨場公司+廠區勾選刪除 ===== */
.xbar{display:flex;justify-content:flex-end;margin:0 0 10px}
.sg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--bd);border-radius:99px;background:#fff}
.sg .sgb{border:0;background:transparent;color:var(--mu);border-radius:99px;padding:5px 14px;font-size:13px;transition:.15s}
.sg .sgb:hover{background:#E4E9F0;color:var(--tx);border:0}
.sg .sgb.on,.sg .sgb.on:hover{background:var(--ac2);color:#fff;font-weight:600}
.cd>h2.chd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.cd.open>h2.chd{margin-bottom:6px}
.cd>.cb{display:none}.cd.open>.cb{display:block}
.sw{flex:0 0 auto;position:relative;width:40px;height:22px;padding:0;border-radius:99px;border:1px solid var(--bd);background:#D9DFE8;transition:background .15s,border-color .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:hover{background:#D9DFE8;border-color:var(--bd)}
.sw[aria-checked=true],.sw[aria-checked=true]:hover{background:var(--ac2);border-color:var(--ac2)}
.sw[aria-checked=true]::after{transform:translateX(18px)}
details.tkg>summary.tkh{list-style:none;cursor:pointer;color:var(--tx)}details.tkg>summary.tkh::-webkit-details-marker{display:none}details.tkg>summary.tkh::before{content:"▸";color:var(--mu);transition:transform .15s}details.tkg[open]>summary.tkh::before{transform:rotate(90deg)}details.tkg:not([open])>summary.tkh{border-bottom:0}
.sw:focus-visible{outline:2px solid #AABAC8;outline-offset:2px}
.stw.sdm{display:flex;gap:8px;align-items:flex-start}.stw.sdm .st{flex:1;min-width:0}
.stck{display:flex;margin:0;padding:11px 0 0}.stck input{width:18px;height:18px;margin:0}
.stsel{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--tx)}.stsel input{width:18px;height:18px;margin:0}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none!important}}
.dlg{position:fixed;inset:0;z-index:100;background:rgba(20,26,40,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.dlgb{background:#fff;border:1px solid var(--bd);border-radius:16px;max-width:420px;width:100%;padding:18px;box-shadow:0 18px 50px rgba(20,26,40,.28)}
.dlgt{white-space:pre-line;font-size:14px;line-height:1.7;word-break:break-word}.dlgr{justify-content:flex-end;margin:14px 0 0}
/* ===== 排班結果手動調整、標題旁教學按鈕（v1.0.3）===== */
button:disabled,button:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--cd);border-color:var(--bd)}
.edb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.edb .edm{flex:1 0 100%;margin:2px 0 0;font-size:13px;color:var(--mu)}.edb .edm.bad{color:var(--bad)}
.fin{display:inline-block;background:#C9DCE8;color:var(--ok);border:1px solid #AABAC8;border-radius:99px;padding:2px 12px;font-size:12.5px;font-weight:600}
.fin.ing{background:#fff6e5;border-color:#f0d8a6;color:#7a4a00}
.cal.ed .cc{cursor:pointer}.cal.ed .cc.dop{outline:2px dashed var(--ac);outline-offset:-2px;background:#EEF1F7}
.cal .ev.ed{cursor:grab;-webkit-user-select:none;user-select:none;border:1px solid var(--bd);border-left-width:3px}
.cal .ev.ed:active{cursor:grabbing}
.cal .ev.ed.sel{outline:2px solid var(--ac2);outline-offset:1px;background-color:#C9DCE8!important;font-weight:650}
.cal .ev.ed:focus-visible{outline:2px solid #AABAC8;outline-offset:1px}
#wlRoot{--bg:#EEF1F7; --card:#ffffff; --ink:#353839; --muted:#5B6573; --line:#D9DFE8;
    --f:#d6336c; --m:#2f5bb7; --m-soft:#e3ebfb;
    --accent:#1A2140;
    --lv0:#2b8a3e; --lv0s:#e6f4ea; --lv1:#e67700; --lv1s:#fff1db; --lv2:#c92a2a; --lv2s:#fde2e2; --lv3:#7a1010;}
#wlRoot *{box-sizing:border-box}
#wlRoot{margin:0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    line-height:1.55;-webkit-text-size-adjust:100%}
#wlRoot .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
#wlRoot header h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.02em}
#wlRoot header p{margin:0;color:var(--muted);font-size:.9rem}
#wlRoot .grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:860px){#wlRoot .grid{grid-template-columns:1.05fr .95fr}#wlRoot .sticky{position:sticky;top:16px}}
#wlRoot .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
#wlRoot .card h2{font-size:1.02rem;margin:0 0 12px}
#wlRoot .card h2 small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
#wlRoot .field{margin-bottom:14px}
#wlRoot .field>label,#wlRoot .field>.lbl{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.95rem;margin-bottom:6px}
#wlRoot .pts{font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem;padding:1px 8px;border-radius:999px;background:#E4E9F2;color:var(--muted);min-width:44px;text-align:center}
#wlRoot .pts.set{background:var(--accent);color:#fff}
#wlRoot .hint{font-size:.8rem;color:var(--muted);margin-top:4px}
#wlRoot input[type=number],#wlRoot input[type=text],#wlRoot input[type=date]{width:100%;font-size:1.02rem;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#ffffff;font-variant-numeric:tabular-nums;font-family:inherit;color:var(--ink)}
#wlRoot input:focus{outline:2px solid #8d98c4;border-color:#8d98c4}
#wlRoot .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#wlRoot .wl-seg{display:flex;gap:8px}
#wlRoot .wl-seg button{flex:1;font-size:1rem;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#ffffff;color:var(--ink);cursor:pointer;font-weight:600;font-family:inherit}
#wlRoot .wl-seg button[aria-pressed=true]{color:#fff;border-color:transparent}
#wlRoot .wl-seg.sex button[data-v=F][aria-pressed=true]{background:var(--f)}
#wlRoot .wl-seg.sex button[data-v=M][aria-pressed=true]{background:var(--m)}
#wlRoot .wl-seg.yn button[aria-pressed=true]{background:var(--accent)}
#wlRoot .cat{font-size:.8rem;color:var(--muted);margin-top:4px;min-height:1.2em}
#wlRoot .wl-big{display:flex;align-items:baseline;gap:10px;margin:4px 0 2px;flex-wrap:wrap}
#wlRoot .pct{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#wlRoot .wl-sub{color:var(--muted);font-size:.88rem}
#wlRoot .badge{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff;white-space:nowrap}
#wlRoot .b0{background:var(--lv0)}
#wlRoot .b1{background:var(--lv1)}
#wlRoot .b2{background:var(--lv2)}
#wlRoot .b3{background:var(--lv3)}
#wlRoot .bn{background:#adb5bd}
#wlRoot .bar{position:relative;height:10px;border-radius:999px;margin:14px 0 4px}
#wlRoot .bar i{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-2px);transition:left .25s}
#wlRoot .barlbl{position:relative;height:1.2em;font-size:.72rem;color:var(--muted)}
#wlRoot .barlbl span{position:absolute;transform:translateX(-50%)}
#wlRoot .barlbl span:first-child{transform:none}
#wlRoot .barlbl span:last-child{transform:none;right:0;left:auto!important}
#wlRoot table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
#wlRoot th,#wlRoot td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
#wlRoot td.n{text-align:right}
#wlRoot tr.total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none}
#wlRoot .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:12px;font-size:.92rem}
#wlRoot .empty{color:var(--muted);font-size:.92rem;padding:6px 0}
#wlRoot .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
#wlRoot .wl-btn{font-size:.9rem;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#ffffff;cursor:pointer;font-weight:600;color:var(--ink);font-family:inherit;text-decoration:none}
#wlRoot .wl-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#wlRoot .alert{background:#fff4e6;border:1px solid #ffd8a8;color:#7a4100;border-radius:10px;padding:10px 12px;font-size:.88rem;margin:10px 0}
#wlRoot .note{background:#E4E9F2;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-top:12px}
#wlRoot details{margin-top:16px}
#wlRoot details summary{cursor:pointer;font-weight:700;padding:6px 0}
#wlRoot .ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
#wlRoot .ref table th{background:#E4E9F2;font-size:.8rem}
#wlRoot .ref .f{color:var(--f);font-weight:700}
#wlRoot .ref .m{color:var(--m);font-weight:700}
#wlRoot caption{text-align:left;font-weight:700;padding:4px 0;font-size:.9rem}
#wlRoot footer{margin-top:22px;font-size:.78rem;color:var(--muted)}
#wlRoot .tabs{display:flex;gap:4px;margin-top:16px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
#wlRoot .tabs a{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:10px 14px;font-weight:700;font-size:.92rem;color:var(--muted);text-decoration:none;border-radius:10px 10px 0 0;margin-bottom:-2px;border:2px solid transparent;white-space:nowrap}
#wlRoot .tabs a[aria-selected=true]{color:var(--ink);background:var(--card);border-color:var(--line);border-bottom-color:var(--card)}
#wlRoot .tabs .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#D9DFE8;color:var(--muted);font-size:.72rem}
#wlRoot .tabs a.wl-done .num{background:var(--lv0);color:#fff}
#wlRoot .tabs a.final .num{background:var(--ink);color:#fff}
#wlRoot .intro{color:var(--muted);font-size:.9rem;margin:14px 0 0}
#wlRoot .src{font-size:.78rem;color:var(--muted);margin:12px 0 0}
#wlRoot .next{display:flex;justify-content:flex-end;margin-top:14px}
#wlRoot .qsec{font-size:1rem;margin:18px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
#wlRoot .qsec:first-child{margin-top:4px}
#wlRoot .q{padding:12px 0;border-bottom:1px solid var(--line)}
#wlRoot .q:last-child{border-bottom:none}
#wlRoot .q .qt{font-weight:600;font-size:.95rem;margin-bottom:8px}
#wlRoot .rev{font-size:.72rem;font-weight:700;color:var(--m);background:var(--m-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
#wlRoot .q.miss .qt{color:var(--lv2)}
#wlRoot .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(max-width:520px){#wlRoot .opts{grid-template-columns:repeat(3,1fr)}}
#wlRoot .opts label{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:#ffffff;cursor:pointer;font-size:.86rem;line-height:1.25}
#wlRoot .opts input{position:absolute;opacity:0;pointer-events:none}
#wlRoot .opts label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#wlRoot .opts label:has(input:focus-visible){outline:2px solid #8d98c4}
#wlRoot .prog{position:sticky;top:0;background:var(--card);padding:0 0 10px;z-index:2;font-size:.85rem;color:var(--muted)}
#wlRoot .pbar{height:6px;background:#E4E9F2;border-radius:999px;margin-top:6px;overflow:hidden}
#wlRoot .pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#wlRoot .bres{padding:12px 0;border-bottom:1px solid var(--line)}
#wlRoot .bres:last-of-type{border-bottom:none}
#wlRoot .bres h3{margin:0;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
#wlRoot .score{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 4px}
#wlRoot .score small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:4px}
#wlRoot .bres p{margin:6px 0 0;font-size:.9rem}
#wlRoot .chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#ffffff}
#wlRoot .chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
#wlRoot .chk b{display:block;font-size:.95rem}
#wlRoot .chk span{font-size:.84rem;color:var(--muted)}
#wlRoot .chk .grp{font-size:.7rem;font-weight:700;color:var(--m);background:var(--m-soft);border-radius:6px;padding:0 6px;margin-left:6px}
#wlRoot .chk:has(input:checked){border-color:var(--accent);background:#fff4e6}
#wlRoot .chk.none:has(input:checked){border-color:var(--lv0);background:var(--lv0s)}
#wlRoot .rgrid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:860px){#wlRoot .rgrid{grid-template-columns:1fr 1fr}#wlRoot .span2{grid-column:1/-1}}
#wlRoot .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
#wlRoot .meta label{font-size:.8rem;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
#wlRoot .wl-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#wlRoot .wl-hero .lvl{font-size:2.4rem;font-weight:800;line-height:1}
#wlRoot .wl-hero .lvl.c0{color:var(--lv0)}
#wlRoot .wl-hero .lvl.c1{color:var(--lv1)}
#wlRoot .wl-hero .lvl.c2{color:var(--lv2)}
#wlRoot .chips{display:flex;gap:8px;flex-wrap:wrap}
#wlRoot .wl-chip{border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:150px;background:#ffffff}
#wlRoot .wl-chip small{display:block;color:var(--muted);font-size:.75rem}
#wlRoot .wl-chip b{font-size:1rem}
#wlRoot .mx{width:100%;border-collapse:separate;border-spacing:4px;font-size:.88rem;text-align:center}
#wlRoot .mx th{background:#E4E9F2;border:none;text-align:center;font-weight:700;font-size:.8rem;padding:8px 4px;border-radius:8px}
#wlRoot .mx td{border:none;border-radius:8px;padding:10px 4px;text-align:center;font-weight:700;opacity:.45}
#wlRoot .mx td.c0{background:var(--lv0s);color:var(--lv0)}
#wlRoot .mx td.c1{background:var(--lv1s);color:var(--lv1)}
#wlRoot .mx td.c2{background:var(--lv2s);color:var(--lv2)}
#wlRoot .mx td.wl-on{opacity:1;outline:3px solid var(--ink);outline-offset:-1px}
#wlRoot .mx.all td{opacity:1}
#wlRoot .wl td.lvl{font-weight:700}
#wlRoot .wl tr.max td{background:#fff4e6}
#wlRoot .measure{font-size:1rem;font-weight:600;padding:12px 14px;border-radius:12px;margin:6px 0 10px}
#wlRoot .measure.c0{background:var(--lv0s)}
#wlRoot .measure.c1{background:var(--lv1s)}
#wlRoot .measure.c2{background:var(--lv2s)}
#wlRoot ul.tight{margin:6px 0 0;padding-left:1.2em;font-size:.88rem}
#wlRoot ul.tight li{margin:3px 0}
#wlRoot .print-only{display:none}
#wlRoot header h1{display:none}
#wlRoot .wrap{padding-top:4px}
#wlRoot .wrap{max-width:1000px;margin:0;padding:0 0 24px}
#wlRoot .badge.bn{display:inline-block;flex-wrap:nowrap;gap:0}
#wlRoot label{margin:0}
#wlRoot .wl-btn:hover{background:#E4E9F2}#wlRoot .wl-btn.primary:hover{background:var(--accent)}
#wlRoot header p{margin:0 0 4px}
body.wlp{background:#fff!important}body.wlp #app{display:none!important}
#wlRoot .wl-report{display:none}
body.wlp #wlRoot{display:block;max-width:none;margin:0;padding:0}
body.wlp #wlRoot>*:not(.wl-report){display:none!important}
body.wlp #wlRoot .wl-report{display:block}
body.wlp *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wl-report{--ink:#353839;--navy:#1A2140;--sky:#C9DCE8;--mist:#EEF1F7;--line:#D9DFE8;--mu:#5B6573;color:var(--ink);font-size:10pt;line-height:1.45}
.rp{width:210mm;height:297mm;box-sizing:border-box;margin:0 auto;background:#fff;overflow:hidden;position:relative}
.rp-top{background:var(--navy);color:#fff;padding:7mm 14mm 5mm;display:flex;align-items:center;gap:5mm}
.rp-top img{width:13mm;height:13mm;border-radius:3mm;background:#fff;padding:1mm;box-sizing:border-box}
.rp-top h1{margin:0;font-size:17pt;line-height:1.2;color:#fff;letter-spacing:.5px}
.rp-top small{display:block;font-size:8.5pt;color:#C9DCE8;margin-top:1mm}
.rp-top .dt{margin-left:auto;text-align:right;font-size:8.5pt;color:#C9DCE8}.rp-top .dt b{display:block;font-size:12pt;color:#fff}
.rp-body{padding:4mm 14mm 0}
.rp-who{display:grid;grid-template-columns:1.1fr 1fr 1.3fr 1.1fr;gap:4mm;background:var(--mist);border-radius:3mm;padding:3mm 4mm}
.rp-who span{display:block;font-size:8pt;color:var(--mu)}.rp-who b{font-size:10.5pt;min-height:1.3em;display:block}
.rp-hero{display:flex;gap:5mm;align-items:stretch;margin-top:3.5mm}
.rp-lvl{flex:0 0 62mm;border-radius:3mm;padding:3mm 5mm;color:#fff}
.rp-lvl small{display:block;font-size:8.5pt;opacity:.9}.rp-lvl b{display:block;font-size:24pt;line-height:1.15;margin:1mm 0}.rp-lvl span{font-size:8.5pt;opacity:.95}
.rp-st{flex:1;display:grid;grid-template-columns:1fr;gap:2mm}
.rp-st div{border:1px solid var(--line);border-left:3mm solid var(--navy);border-radius:2mm;padding:1.6mm 4mm;display:flex;align-items:baseline;justify-content:space-between;gap:3mm}
.rp-st small{font-size:8.5pt;color:var(--mu)}.rp-st b{font-size:11.5pt}
.rp-h{margin:3.6mm 0 1.6mm;font-size:11pt;color:var(--navy);font-weight:800;display:flex;align-items:center;gap:2mm}
.rp-h::before{content:"";width:1.6mm;height:4.5mm;background:var(--navy);border-radius:1mm}
.rp-2{display:grid;grid-template-columns:1fr 1.25fr;gap:5mm}
.rp-card{border:1px solid var(--line);border-radius:3mm;padding:3mm 4mm}
.rp-card .pc{font-size:22pt;font-weight:800;line-height:1.1;color:var(--navy)}
.rp-card .pc .badge{font-size:8.5pt;vertical-align:middle;margin-left:2mm}
.rp-card .sb{font-size:8.5pt;color:var(--mu);margin-top:1mm}
.rp-card .bar{margin:3mm 0 1mm}.rp-card .barlbl{font-size:7.5pt}
.rp-card table{font-size:9pt;margin:0}.rp-card th{background:var(--mist);font-size:8.5pt;color:var(--mu)}.rp-card th,.rp-card td{padding:1.4mm 2mm}
.rp-card tr.max td{background:#fff4e6}
.rp-card .badge{font-size:8pt;padding:0 2.5mm}
.rp-mx{border-collapse:separate;border-spacing:1mm;font-size:9pt;text-align:center;width:100%}
.rp-mx th{background:var(--mist);border:none;font-size:8pt;padding:1.2mm;border-radius:1.5mm;color:var(--mu)}
.rp-mx td{border:none;border-radius:1.5mm;padding:1.6mm;font-weight:700;opacity:.45}
.rp-mx td.c0{background:var(--lv0s);color:var(--lv0)}.rp-mx td.c1{background:var(--lv1s);color:var(--lv1)}.rp-mx td.c2{background:var(--lv2s);color:var(--lv2)}
.rp-mx td.on{opacity:1;outline:.6mm solid var(--navy);outline-offset:-.3mm}
.rp-note{font-size:8.5pt;color:var(--mu);margin-top:2mm}
.rp-say{border-left:3mm solid;border-radius:2mm;padding:2.4mm 4mm;font-weight:700;font-size:10pt}
.rp-say.c0{border-color:var(--lv0);background:var(--lv0s)}.rp-say.c1{border-color:var(--lv1);background:var(--lv1s)}.rp-say.c2{border-color:var(--lv2);background:var(--lv2s)}
.rp ul{margin:2mm 0 0;padding-left:5mm;font-size:9.5pt}.rp li{margin:.8mm 0}
.rp-fu{border:.5mm solid var(--navy);border-radius:3mm;padding:3mm 4mm;display:flex;gap:5mm;align-items:center}
.rp-fu .nx{flex:0 0 58mm}.rp-fu .nx small{display:block;font-size:8.5pt;color:var(--mu)}.rp-fu .nx b{font-size:15pt;color:var(--navy);line-height:1.25;display:block}
.rp-fu .tl{flex:1;display:flex;gap:2mm;flex-wrap:wrap}
.rp-fu .tl span{background:var(--mist);border-radius:2mm;padding:1.4mm 3mm;font-size:9pt}.rp-fu .tl span i{display:block;font-style:normal;font-size:7.5pt;color:var(--mu)}
.rp-foot{position:absolute;left:14mm;right:14mm;bottom:6mm;border-top:1px solid var(--line);padding-top:2.5mm;font-size:7.5pt;color:var(--mu);line-height:1.5}
.rp-foot b{color:var(--navy)}


.tip{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ac2);color:#fff;font-size:11px;font-style:normal;font-weight:700;cursor:help;margin-left:4px;vertical-align:1px}
.tip::after{content:attr(data-tip);position:absolute;left:-8px;bottom:calc(100% + 7px);width:max-content;max-width:280px;background:var(--ac2);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:400;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30;text-align:left}
.tip:hover::after,.tip:focus::after{opacity:1}
/* ===== 臨場工作台（v1.1.0）===== */
.dkq{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.dkt{display:inline-block;font-size:12px;line-height:1.6;padding:1px 9px;border-radius:99px;background:#C9DCE8;color:#1A2140;margin:2px 4px 0 0}
.dkt.y{background:#fff6e5;color:#7a4a00}.dkt.r{background:#fdecea;color:var(--bad)}.dkt.g{background:#C9DCE8;color:var(--ok)}
.dkrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.dkrow:last-child{border-bottom:0}
.dkrow>input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex:none}
.dkbd{flex:1;min-width:0;cursor:pointer}.dkdn{text-decoration:line-through;color:var(--mu)}
.dkcl{cursor:pointer;border-radius:8px}.dkcl:hover{background:#EEF1F7}
.dkdt{flex:0 0 46px;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:2px 0;background:#F5F5F5;line-height:1.25}.dkdt b{display:block;font-size:18px}.dkdt span{font-size:11px;color:var(--mu)}
.dkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.dkv{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:#F5F5F5;cursor:pointer}.dkv:hover{border-color:#AABAC8;background:#EEF1F7}.dkv.hid{opacity:.6}
.dkbar{height:6px;background:#D9DFE8;border-radius:8px;overflow:hidden;margin:4px 0}.dkbar i{display:block;height:100%;background:var(--ac2)}
.dkmc{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:4px 0;scrollbar-width:thin}.dkmc button{white-space:nowrap;border-radius:99px;padding:5px 13px;background:#fff;color:var(--mu)}.dkmc button.on{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:600}.dkmc i{font-style:normal;margin-left:5px;background:#C9DCE8;color:#1A2140;border-radius:99px;padding:0 6px;font-size:11px}.dkmc button.on i{background:#fff}
.dkb{max-width:620px;max-height:90vh;max-height:90dvh;overflow:auto}
.dkh{display:flex;justify-content:space-between;align-items:center;gap:8px}.dkh h3{margin:0;font-size:18px}
.dkft{position:sticky;bottom:-18px;background:#fff;border-top:1px solid var(--bd);margin-top:14px;padding:10px 0 2px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.dkck{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}.dkck input{width:auto;margin:0}
.dkr{grid-column:1/-1;display:grid;gap:10px}.dkr.n3{grid-template-columns:repeat(3,minmax(0,1fr))}.dkr.n2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:560px){.dkr.n3{grid-template-columns:1fr}}
.dkgrp{border:1px solid var(--bd);border-radius:12px;background:#F5F5F5;margin:10px 0;padding:0 12px}.dkgrp>summary{padding:10px 0;font-weight:600}.dkgrp[open]{padding-bottom:10px}
.dksy{background:#fff6e5;border-color:#f0d8a6}
.dkyr{min-width:84px;text-align:center;font-size:20px;color:var(--ac2)}
.dkqd{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dkqd button{padding:3px 11px;font-size:12.5px}
.dkgh{font-size:15px;margin:16px 0 4px}.dkbad{color:var(--bad)}
.dkpk{width:150px;flex:none}
.dkyt td.dkm{cursor:pointer;min-width:64px;height:48px}.dkyt td.dkm:hover{background:#EEF1F7}
.dkyt th:first-child,.dkyt td:first-child{position:sticky;left:0;background:#fff;min-width:96px;z-index:1}.dkyt{min-width:900px}
.dkch{display:block;font-size:12px;border-radius:4px;padding:1px 6px;margin-bottom:2px;background:#C9DCE8;color:#1A2140;cursor:pointer}.dkch.done{background:#D9DFE8;color:var(--mu)}.dkch.plan{background:#EEF1F7;border:1px solid #AABAC8}.dkch.cancel{text-decoration:line-through;opacity:.6}
.warn.bad{color:var(--bad)}.warn{border:1px solid #f0c9c5;background:#fdf3f2;border-radius:10px;padding:6px 10px;font-size:13.5px;margin-top:8px}
.dpx{position:relative;display:inline-flex;align-items:center;gap:4px;max-width:100%}
.dpx .dpt{flex:1;min-width:0;width:100%}.dpx .dpt.bad{border-color:#c92a2a;background:#fde2e2}
.dpx .dpb{flex:none;padding:6px 8px;line-height:1;background:#fff;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:1rem}
.dpx .dpo{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.coffee.shr{background:#EEF1F7;border-color:#D9DFE8;color:#1A2140;cursor:pointer;font-family:inherit}.coffee.shr:hover{background:#C9DCE8}
.shs{position:fixed;inset:0;z-index:9999;background:rgba(26,33,64,.45);display:flex;align-items:flex-end;justify-content:center}
.shb{background:#fff;width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.shb h3{margin:0 0 14px;font-size:17px;color:#1A2140}
.shg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shg a,.shg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;background:#EEF1F7;border:1px solid #D9DFE8;border-radius:12px;color:#1A2140;font:600 13px/1.2 inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.shg a span,.shg button span{font-size:24px}.shg a:active,.shg button:active{background:#C9DCE8}
.shu{width:100%;box-sizing:border-box;margin-top:14px;padding:9px 10px;border:1px solid #D9DFE8;border-radius:8px;font-size:13px;color:#5B6573;background:#fff}
.shx{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:#1A2140;color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
@media(min-width:600px){.shs{align-items:center}.shb{border-radius:18px}}
