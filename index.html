<style>
:root{--bg:#f6f6f3;--cd:#ffffff;--tx:#1f2430;--mu:#6b7080;--bd:#e6e5df;--ac:#35629f;--ac2:#26324a;--hl:#f0f4fa;--ok:#2f7a5a;--bad:#b5473f;--sh:0 1px 2px rgba(31,36,48,.04);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{max-width:none;margin:0;padding:0}

.nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 8px;z-index:5;scrollbar-width:none}
.nav button{white-space:nowrap;border-radius:99px;padding:7px 14px}.nav button span{margin-right:4px}

button,.btn{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}button.big{width:100%;padding:12px;font-size:16px}
button.x{padding:3px 9px;color:var(--mu)}

.cd h2{font-size:16px;margin:0 0 2px}.ds{margin:0 0 10px;color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
input[type=checkbox]{width:auto}textarea{min-height:76px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.chip{display:inline-block;margin:3px 4px 3px 0;color:var(--tx);font-size:14px}.chip input{position:absolute;opacity:0;pointer-events:none}

.site.ex{background:var(--hl);border-color:var(--ac)}.sh{display:flex;gap:8px;margin-bottom:6px}.sh input{font-weight:600}
.ml{font-size:13px;color:var(--mu);margin:4px 0}.ml a,.lk,a{color:var(--ac)}
.tk .r1{display:flex;gap:8px;align-items:center}.tk .r1 select{flex:1}.tk .r1 select+select{flex:0 0 80px}.tk .r2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.tk.off{opacity:.45}

.vr{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}.vr:last-child{border:0}.vr b{flex:0 0 190px}.vr span{color:var(--mu)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left;vertical-align:top;white-space:nowrap;font-size:14px}th{font-size:12px;color:var(--mu)}

.cc{min-height:74px;border:1px solid var(--bd);border-radius:8px;padding:3px;background:var(--cd)}.cc.e{background:var(--bg);opacity:.55}.cc.hl{background:var(--hl);opacity:1}
.dn{font-size:11px;color:var(--mu)}.ev{color:#fff;font-size:11px;border-radius:5px;padding:1px 5px;margin-top:2px;line-height:1.3}

.cd p{margin:6px 0}

/* ===== 淺色簡約主題（Soft Paper × Ink Blue）===== */

.top{padding:10px 2px 14px;border-bottom:1px solid var(--bd);margin-bottom:10px}

input,select,textarea{background:#fbfbf9;border-color:var(--bd)}

th{font-weight:600;letter-spacing:.3px;color:var(--mu)}
code{background:#f1f0ec;color:#35476a}

.hero{background:linear-gradient(135deg,#ffffff 0%,#f1f5fb 100%);border:1px solid var(--bd);color:var(--tx);box-shadow:var(--sh)}
.hero h2{color:var(--tx)}.hero p{color:var(--mu);opacity:1}
.av{background:var(--ac2);color:#fff}
.pill{background:#fff;border-color:var(--bd);color:var(--tx)}.pill:hover{border-color:#b9c6dc}.pill .av{background:var(--ac2);color:#fff}
.ct a{background:#fbfbf9;border-color:var(--bd);transition:.15s}.ct a:hover{border-color:#a9bfe0;background:#f3f6fb}

.atop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.ft{max-width:900px;width:100%;margin:0 auto;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));color:var(--mu);font-size:12px;line-height:1.8;text-align:center}.ft>div:first-child{border-top:1px solid var(--bd);padding-top:14px}.ft a,.legal a{color:var(--ac);cursor:pointer}.ft .dis{max-width:720px;margin:6px auto 8px;font-size:11.5px;line-height:1.75}.ft .lk2 a{margin:0 6px}

/* ===== 左側欄（可展開／釘選）===== */
:root{--sbc:64px;--sbe:244px}
.shell{display:flex;align-items:stretch;min-height:100vh;min-height:100dvh}
.sbw{flex:0 0 var(--sbc);width:var(--sbc);position:relative;z-index:30;transition:flex-basis .2s ease,width .2s ease}
.shell.pin .sbw{flex-basis:var(--sbe);width:var(--sbe)}
.sb{position:sticky;top:0;height:100vh;height:100dvh;width:var(--sbc);display:flex;flex-direction:column;gap:2px;padding:12px 10px;background:var(--cd);border-right:1px solid var(--bd);overflow:hidden;transition:width .2s ease,box-shadow .2s ease}
.sb:is(:hover,.xp,:has(:focus-visible)){width:var(--sbe)}
.shell:not(.pin) .sb:is(:hover,.xp,:has(:focus-visible)){box-shadow:10px 0 30px rgba(31,36,48,.12)}
.sbh{display:flex;align-items:center;gap:10px;padding:0 3px 12px;min-height:50px}.sbh svg{flex:0 0 36px}
.sbh b{display:block;font-size:16px;line-height:1.2;letter-spacing:.3px;font-weight:650}.sbh b em{font-style:normal;color:var(--ac)}.sbh small{color:var(--mu);font-size:12px}
.sbx{display:none;margin-left:auto}
.lb{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:middle;transition:max-width .2s ease,opacity .15s ease}
.sb:is(:hover,.xp,:has(:focus-visible)) .lb{max-width:190px;opacity:1}
.sbn{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.sbg{margin:8px 6px 0;padding:8px 4px 2px;border-top:1px solid var(--bd);font-size:11px;letter-spacing:.5px;color:var(--mu);height:26px;white-space:nowrap;overflow:hidden}.sbg:first-child{border:0;margin-top:0}
.sbi{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--mu);text-align:left;font-size:14.5px;flex:0 0 auto}
.sbi .ic{flex:0 0 22px;text-align:center;font-size:18px;line-height:1}
.sbi:hover{background:#f3f5f9;border-color:transparent;color:var(--tx)}
.sbi.on,.sbi.on:hover{background:var(--ac2);border-color:var(--ac2);color:#fff;box-shadow:0 2px 6px rgba(38,50,74,.18)}
.sbi:focus-visible{outline:2px solid #a9bfe0;outline-offset:1px}
.sbf{border-top:1px solid var(--bd);margin-top:6px;padding-top:8px;display:flex;flex-direction:column;gap:2px}
.sbpin.on{background:var(--hl);border-color:#a9bfe0;color:var(--ac2)}
.shell.pin .sbtg{display:none}
.sbv{font-size:11px;color:var(--mu);padding:4px 12px 0;white-space:nowrap;overflow:hidden}
.sbk,.mbar{display:none}
.mn{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.mnin{flex:1;width:100%;max-width:900px;margin:0 auto;padding:10px 18px 24px}
.pg h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px;line-height:1.3}.pg h1 span{margin-right:6px}
.pg small{display:block;color:var(--mu);font-size:12px;line-height:1.5}.pg small i{font-style:normal}
.clv{padding:12px 0;border-bottom:1px solid var(--bd)}.clv:last-child{border:0;padding-bottom:2px}.clv:first-child{padding-top:2px}
.clh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.clh b{font-size:15px}

@media (max-width:819px){
 .sbw{position:fixed;inset:0 auto 0 0;width:0;flex:none;pointer-events:none;transition:none}

 .sb,.shell .sb:is(:hover,.xp,:has(:focus-visible)){position:fixed;left:0;top:0;bottom:0;height:auto;width:min(272px,86vw);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-104%);transition:transform .22s ease,box-shadow .22s ease;pointer-events:auto;box-shadow:none}

 .mbar .mb{font-size:20px;line-height:1;padding:7px 11px}.mbar b{font-size:16px;font-weight:650}.mbar b em{font-style:normal;color:var(--ac)}
 .mnin{padding:8px 12px 20px}
}
.shell.drawer+.ack{display:none}
.avimg{display:block;flex:0 0 auto;width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:center;background:#fff;border:1px solid var(--bd)}

.legal .ls summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}

/* ===== 點選式日期、服務單位與任務排版 ===== */
.sub{font-size:14px;margin:16px 0 2px}

.st .sn{flex:1 1 150px;min-width:0}.st .sn b{display:block;font-size:15px}.st .sn small{color:var(--mu);font-size:12px}
.st .sm{display:flex;flex-wrap:wrap;gap:2px}
.stb{padding:4px 12px 12px;border-top:1px solid var(--bd)}
.adv{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:2px 10px 8px;margin-top:10px}.adv>summary{padding:6px 0}
.tkg{border:1px solid var(--bd);border-radius:12px;background:#fbfbf9;margin-bottom:10px;overflow:hidden}
.tkh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#f3f6fb;border-bottom:1px solid var(--bd)}.tkh b{font-size:14.5px}.tkh small{color:var(--mu);font-size:12px;flex:1}
.tk2{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--bd)}.tk2:last-child{border:0}.tk2.off{opacity:.45}
.tk2 select{width:auto;padding:4px 8px}.tk2 input[type=checkbox]{width:18px;height:18px}.tk2 .chip{margin:0}
.tk2 .lkw{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}.tk2 .lkw input{width:auto;padding:4px 8px}

/* ===== 品牌圖／條款分頁 ===== */
:root{--sbe:256px}
.lgimg{display:block;flex:0 0 auto;border-radius:22%;border:1px solid var(--bd);background:#fff;object-fit:cover}
.sbh .lgimg{width:40px;height:40px;flex-basis:40px}
.sbh{align-items:flex-start}.sbh .lgimg{margin-top:2px}.sbh .lb{min-width:0}.sbh .tgl{display:block;white-space:normal;font-size:10.5px;line-height:1.45;margin-top:3px;text-wrap:balance}
.lgt{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 0 4px}
.lgb{border-radius:99px;padding:6px 16px;background:#fff;color:var(--mu)}
.lgb.on,.lgb.on:hover{background:#e8eef8;border-color:#9fb7dc;color:#26324a;font-weight:600}
.lgp{border:1px solid var(--bd);border-radius:12px;background:#fbfbf9;padding:10px 16px;margin-top:8px;font-size:14px}.lgp[hidden]{display:none}
.lgp h3{display:none}
.t24{display:inline-flex;align-items:center;gap:4px}.t24 select{width:auto;min-width:62px;padding:5px 8px}
@media (prefers-reduced-motion:reduce){.sbw,.sb,.lb{transition:none!important}}
